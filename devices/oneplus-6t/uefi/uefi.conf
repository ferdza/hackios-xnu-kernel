# UEFI packaging values for the top-level mkxnuimg.py (the fastboot-boot image packer), for fajita.
#
# These are NOT the kernel's soc.args and NOT the EDK2 PCDs. They tell mkxnuimg.py where to find the
# built UEFI firmware volume for this device and where its boot shim must copy it in RAM:
#
#   stem     the Mu-Silicium package stem -> Build/<stem>Pkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
#            and Resources/DTBs/<stem>.dtb  (fajita, derived from enchilada by make-fajita-pkg.sh).
#   fd_base  where the BootShim copies the FD so the UEFI runs at its linked address.
#   fd_size  the exact size of SILICIUM_UEFI.fd (mkxnuimg asserts the built .fd is this big).
#
# Source of truth: Mu-Silicium Resources/Configs/fajita.toml  ->  [uefi_fd] base/size, which
# make-fajita-pkg.sh copies verbatim from enchilada.toml (OnePlus 6, same SDM845 "Napali" flash
# layout). The POCO/redwood values (0x9FD00000 / 0x200000) are mkxnuimg.py's built-in default and
# differ from fajita's on BOTH base and size -- which is exactly why this file has to exist.
stem=fajita
fd_base=0x9FC00000
fd_size=0x300000
